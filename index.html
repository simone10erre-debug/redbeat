<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Beat - Professional Player & Admin</title>
    <style>
        :root {
            --bg-dark: #090909;
            --bg-main: #121212;
            --bg-card: #181818;
            --bg-hover: #282828;
            --red-primary: #e50914;
            --red-hover: #b8070f;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- INTERFACCIA PRINCIPALE --- */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 90px);
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-dark);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            cursor: pointer;
        }

        .logo span { color: var(--red-primary); }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 0;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-white);
        }

        /* Sezione Autenticazione Utente */
        .auth-sidebar-box {
            background-color: var(--bg-card);
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #282828;
        }

        .auth-sidebar-box input {
            width: 100%;
            padding: 6px 10px;
            background-color: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-size: 11px;
        }

        .btn-auth {
            background-color: var(--red-primary);
            color: white;
            border: none;
            padding: 6px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-auth.secondary { background-color: #333; }

        /* Sezione Playlist nella Sidebar */
        .playlist-sidebar-section {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-create-playlist {
            background-color: #222;
            color: white;
            border: 1px dashed #444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-create-playlist:hover { background-color: #333; border-color: var(--red-primary); }

        .playlists-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 10px;
            background-color: #141414;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .playlist-item:hover { background-color: var(--bg-hover); }

        /* Barra di Ricerca */
        .search-container {
            margin-bottom: 25px;
            display: none;
            max-width: 400px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border: 1px solid #333;
            border-radius: 24px;
            color: white;
            font-size: 14px;
        }

        .search-container input:focus {
            border-color: var(--red-primary);
            outline: none;
        }

        /* Contenuto Principale */
        .main-content {
            flex: 1;
            background: linear-gradient(to bottom, #3a0608 0%, var(--bg-main) 40%);
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .header-playlist-view {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
        }

        .btn-add-songs-to-pl {
            background-color: var(--red-primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .btn-add-songs-to-pl:hover {
            transform: scale(1.1);
            background-color: var(--red-hover);
        }

        /* Griglia Card */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .music-card {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 6px;
            width: 180px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .music-card.hidden-search {
            display: none !important;
        }

        .music-card:hover {
            background-color: var(--bg-hover);
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .music-card h3 {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card p {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        /* --- OVERLAY SELEZIONE BRANI PER PLAYLIST --- */
        .songs-selector-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.98);
            z-index: 80;
            padding: 40px;
            overflow-y: auto;
            display: none;
        }
        .songs-selector-overlay.active { display: block; }

        .selector-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            max-width: 600px;
        }

        .selector-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: var(--bg-card);
            border-radius: 6px;
            border: 1px solid #282828;
        }

        .selector-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .selector-info img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .btn-add-action-trigger {
            background-color: #222;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-add-action-trigger.added {
            background-color: #2e7d32;
            border-color: #2e7d32;
        }

        /* --- CONTROLLI PLAYER INFERIORE --- */
        .player-bar {
            height: 90px;
            background-color: var(--bg-card);
            border-top: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }

        .track-spec {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .track-spec img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #282828;
        }

        .track-spec-text h4 { font-size: 14px; }
        .track-spec-text p { font-size: 12px; color: var(--text-gray); }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .playback-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-round-play {
            background-color: var(--text-white);
            color: black;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-round-play:hover {
            transform: scale(1.05);
            background-color: var(--red-primary);
            color: white;
        }

        .sub-btn {
            background: none;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 16px;
        }

        .sub-btn:hover { color: var(--text-white); }

        .timeline-block {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 11px;
            color: var(--text-gray);
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #535353;
            outline: none;
            cursor: pointer;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--red-primary);
        }

        .player-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            width: 30%;
        }

        /* --- DASHBOARD SEPARATA --- */
        .management-dashboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            z-index: 110;
            padding: 40px;
            overflow-y: auto;
            display: none;
        }

        .management-dashboard.active { display: block; }

        .dash-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 30px;
        }

        .input-form {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row label {
            font-size: 12px;
            color: var(--text-gray);
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-row input {
            background-color: var(--bg-hover);
            border: 1px solid #404040;
            padding: 12px;
            color: white;
            border-radius: 4px;
        }

        .form-row input:focus { border-color: var(--red-primary); outline: none; }

        .btn-submit-track {
            background-color: var(--red-primary);
            color: white;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit-track:hover { background-color: var(--red-hover); }

        .manage-tracks-container {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            max-height: 500px;
            overflow-y: auto;
        }

        .manage-track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #282828;
            gap: 10px;
        }

        .manage-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .manage-track-info img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .manage-track-meta h4 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .manage-track-meta p {
            font-size: 12px;
            color: var(--text-gray);
        }

        .manage-actions {
            display: flex;
            gap: 8px;
        }

        .btn-manage {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .btn-edit-action { background-color: #333; }
        .btn-edit-action:hover { background-color: #444; }
        .btn-delete-action { background-color: var(--red-primary); }
        .btn-delete-action:hover { background-color: var(--red-hover); }
    </style>
</head>
<body>

    <audio id="audioEngine"></audio>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="logo" onclick="showHome()">Red<span>Beat</span></div>
            <div class="nav-link active" id="sideHomeBtn" onclick="showHome()">🏠 Home</div>
            <div class="nav-link" id="sideSearchBtn" onclick="activateSearchMode()">🔍 Cerca</div>
            
            <div class="auth-sidebar-box" id="authBox">
                <span id="authStatusText" style="font-weight: bold; color: var(--text-gray);">Sincronizza Playlist Cloud</span>
                <div id="authInputs">
                    <input type="email" id="authEmail" placeholder="Email">
                    <input type="password" id="authPassword" placeholder="Password">
                    <button class="btn-auth" onclick="handleMailLogin()">Accedi</button>
                    <button class="btn-auth secondary" onclick="handleMailRegister()">Registrati</button>
                </div>
                <div id="authLogged" style="display: none; flex-direction: column; gap: 6px;">
                    <span id="userDisplayMail" style="word-break: break-all; color: #4caf50;"></span>
                    <button class="btn-auth secondary" onclick="handleLogout()">Esci</button>
                </div>
            </div>

            <div class="playlist-sidebar-section">
                <button class="btn-create-playlist" onclick="createNewPlaylist()">➕ Crea Playlist</button>
                <div class="playlists-list" id="playlistsContainer">
                    </div>
            </div>
        </aside>

        <main class="main-content" id="mainHomeView">
            
            <div class="search-container" id="searchWrapper">
                <input type="text" id="searchInput" placeholder="Cosa vuoi ascoltare? (Filtra per titolo o artista)" oninput="executeSearch()">
            </div>

            <div class="header-playlist-view">
                <div class="section-title" id="pageMainTitle">Brani Consigliati</div>
                <button class="btn-add-songs-to-pl" id="addSongsToPlaylistBtn" style="display: none;" onclick="openSongsSelector()" title="Aggiungi brani a questa playlist">+</button>
            </div>
            
            <div class="grid-container" id="dynamicGrid">
                </div>

            <div class="songs-selector-overlay" id="songsSelectorModal">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Scegli i brani della Home da aggiungere</h2>
                    <button class="sub-btn" style="background:#222; padding:8px 16px; border-radius:20px; color:white;" onclick="closeSongsSelector()">Fatto ✓</button>
                </div>
                <div class="selector-list" id="selectorTracksContainer">
                    </div>
            </div>
        </main>

        <div class="management-dashboard" id="adminDashboard">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="dashFormTitle">Inserisci Nuovo Brano</h2>
                <button class="sub-btn" style="background: var(--bg-hover); padding: 10px 20px; border-radius: 20px; color: white;" onclick="exitDashboard()">← Torna al Player</button>
            </div>

            <div class="dash-layout">
                <form class="input-form" onsubmit="commitTrackForm(event)">
                    <input type="hidden" id="editingTrackId" value="">
                    
                    <div class="form-row">
                        <label>Titolo del Brano</label>
                        <input type="text" id="formTitle" placeholder="Es. Blinding Lights" required>
                    </div>
                    <div class="form-row">
                        <label>Artista / Gruppo</label>
                        <input type="text" id="formArtist" placeholder="Es. The Weeknd" required>
                    </div>
                    <div class="form-row">
                        <label>URL Immagine Copertina</label>
                        <input type="url" id="formCover" placeholder="Incolla link (.jpg / .png)" required>
                    </div>
                    <div class="form-row">
                        <label>URL Traccia Audio (.mp3)</label>
                        <input type="url" id="formAudio" placeholder="Incolla link file audio online" required>
                    </div>
                    <button type="submit" class="btn-submit-track" id="formSubmitBtn">Carica Brano in Home</button>
                    <button type="button" class="btn-submit-track" id="cancelEditBtn" style="background-color:#444; display:none;" onclick="resetFormState()">Annulla Modifica</button>
                </form>

                <div class="manage-tracks-container">
                    <h3 style="margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #333;">Gestione Brani Esistenti</h3>
                    <div id="adminTracksList"></div>
                </div>
            </div>
        </div>

    </div>

    <footer class="player-bar">
        <div class="track-spec">
            <img id="currentCover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500" alt="Cover">
            <div class="track-spec-text">
                <h4 id="currentTitle">Nessun brano</h4>
                <p id="currentArtist">Seleziona una traccia</p>
            </div>
        </div>

        <div class="player-center">
            <div class="playback-buttons">
                <button class="sub-btn" onclick="alert('Autoplay Casuale attivo alla fine dei brani!')">🔀</button>
                <button class="sub-btn" onclick="playRandomTrack()">⏮</button>
                <button class="btn-round-play" id="masterPlayBtn" onclick="togglePlayback()">▶</button>
                <button class="sub-btn" onclick="playRandomTrack()">⏭</button>
                <button class="sub-btn" onclick="alert('Ripetizione disattivata')">🔁</button>
            </div>
            <div class="timeline-block">
                <span id="timeCurrent">0:00</span>
                <input type="range" id="timeline" class="range-slider" min="0" value="0" oninput="changeTimelinePosition()">
                <span id="timeDuration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <div style="display: flex; align-items: center; gap: 8px; width: 130px;">
                <span>🔊</span>
                <input type="range" id="volumeControl" class="range-slider" min="0" max="1" step="0.05" value="0.8" oninput="adjustVolume()">
            </div>
            <button class="sub-btn" style="font-size: 18px;" onclick="openAdminGoogleLogin()" title="Dashboard di Amministrazione">⚙️ Dashboard</button>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        // Configurazione Firebase Web App Ufficiale
        const firebaseConfig = {
            apiKey: "AIzaSyDai_-FplRtAI0fUXgfClBzrRprZFHL4OU",
            authDomain: "redbeat.firebaseapp.com",
            projectId: "redbeat",
            storageBucket: "redbeat.firebasestorage.app",
            messagingSenderId: "951595303453",
            appId: "1:951595303453:web:23e2f3829dd51ba1707cf4",
            measurementId: "G-YF6YXL7Y9D"
        };

        // Inizializzazione Core
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const rtdb = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "simone10erre@gmail.com";
        let currentLoggedUser = null;

        // --- AUTENTICAZIONE AMMINISTRATORE REALE CON GOOGLE ---
        async function openAdminGoogleLogin() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                if(user.email === ADMIN_EMAIL) {
                    alert("Benvenuto Simone! Accesso alla Dashboard sbloccato con il tuo account Google.");
                    syncAdminTracksList();
                    document.getElementById('adminDashboard').classList.add('active');
                } else {
                    alert("Accesso Negato. Solo l'indirizzo email simone10erre@gmail.com può amministrare la piattaforma.");
                    await signOut(auth);
                }
            } catch(error) {
                console.error("Errore autenticazione Google:", error);
                alert("Impossibile completare l'accesso sicuro con Google.");
            }
        }

        // --- SISTEMA ACCOUNT UTENTI (EMAIL/PASSWORD) ---
        async function handleMailRegister() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if(!email || !password) return alert("Inserisci credenziali valide!");

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Account Creato! Le tue playlist si sincronizzeranno su tutti i dispositivi.");
            } catch(e) { alert("Errore: " + e.message); }
        }

        async function handleMailLogin() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if(!email || !password) return alert("Inserisci email e password!");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Accesso eseguito con successo!");
            } catch(e) { alert("Errore di login: " + e.message); }
        }

        async function handleLogout() {
            if(confirm("Vuoi disconnetterti?")) {
                await signOut(auth);
                window.location.reload();
            }
        }

        // Tracciamento stato utente cloud
        onAuthStateChanged(auth, (user) => {
            const inputs = document.getElementById('authInputs');
            const logged = document.getElementById('authLogged');
            const statusText = document.getElementById('authStatusText');
            const displayMail = document.getElementById('userDisplayMail');

            if(user) {
                currentLoggedUser = user;
                inputs.style.display = "none";
                logged.style.display = "flex";
                statusText.innerText = "Sincronizzazione Attiva ☁️";
                displayMail.innerText = user.email;

                // Recupera Playlist dal Realtime Database
                onValue(ref(rtdb, 'playlists/' + user.uid), (snapshot) => {
                    const data = snapshot.val();
                    window.userPlaylists = data ? data : {};
                    window.renderPlaylistsSidebar();
                });
            } else {
                currentLoggedUser = null;
                inputs.style.display = "flex";
                logged.style.display = "none";
                statusText.innerText = "Sincronizza Playlist Cloud";
                window.userPlaylists = {};
                window.renderPlaylistsSidebar();
            }
        });

        // Sincronizza lo stato delle playlist sul Realtime Database
        async function syncPlaylistsToCloud() {
            if(!currentLoggedUser) return; 
            try {
                await set(ref(rtdb, 'playlists/' + currentLoggedUser.uid), window.userPlaylists);
            } catch (e) {
                console.error("Errore salvataggio playlist: ", e);
            }
        }

        // --- ASCOLTO IN TEMPO REALE DEI BRANI DALLA HOME (REALTIME DB) ---
        onValue(ref(rtdb, 'brani'), (snapshot) => {
            window.allTracksData = [];
            const data = snapshot.val();
            if(data) {
                Object.keys(data).forEach(key => {
                    window.allTracksData.push({ id: key, ...data[key] });
                });
                window.allTracksData.sort((a,b) => b.timestamp - a.timestamp);
            }
            window.renderHomeGrid();
            if(document.getElementById('adminDashboard').classList.contains('active')) {
                syncAdminTracksList();
            }
        });

        // --- CRUD OPERAZIONI AMMINISTRATORE ---
        async function commitTrackForm(event) {
            event.preventDefault();
            if(!auth.currentUser || auth.currentUser.email !== ADMIN_EMAIL) return alert("Azione non autorizzata. Esegui prima l'accesso amministratore con Google.");

            const targetId = document.getElementById('editingTrackId').value;
            const trackPayload = {
                title: document.getElementById('formTitle').value.trim(),
                artist: document.getElementById('formArtist').value.trim(),
                cover: document.getElementById('formCover').value.trim(),
                audio: document.getElementById('formAudio').value.trim(),
                timestamp: Date.now()
            };

            try {
                if(targetId === "") {
                    const newTrackRef = push(ref(rtdb, 'brani'));
                    await set(newTrackRef, trackPayload);
                    alert("Nuovo brano pubblicato sul cloud per tutti!");
                } else {
                    await set(ref(rtdb, 'brani/' + targetId), trackPayload);
                    alert("Brano modificato sul cloud!");
                }
                resetFormState();
            } catch(e) { alert("Errore di scrittura: " + e.message); }
        }

        async function deleteTrack(id) {
            if(!auth.currentUser || auth.currentUser.email !== ADMIN_EMAIL) return;
            if(confirm("Sei sicuro di voler eliminare questo brano dalla cloud home di tutti?")) {
                try {
                    await remove(ref(rtdb, 'brani/' + id));
                    alert("Traccia eliminata!");
                    resetFormState();
                } catch(e) { alert("Impossibile eliminare: " + e.message); }
            }
        }

        // Esponi le funzioni necessarie globalmente
        window.openAdminGoogleLogin = openAdminGoogleLogin;
        window.handleMailRegister = handleMailRegister;
        window.handleMailLogin = handleMailLogin;
        window.handleLogout = handleLogout;
        window.commitTrackForm = commitTrackForm;
        window.deleteTrack = deleteTrack;
        window.syncPlaylistsToCloud = syncPlaylistsToCloud;
    </script>

    <script>
        const audioEngine = document.getElementById('audioEngine');
        const masterPlayBtn = document.getElementById('masterPlayBtn');
        const timeline = document.getElementById('timeline');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeDuration = document.getElementById('timeDuration');
        const volumeControl = document.getElementById('volumeControl');
        
        window.userPlaylists = {}; 
        window.activePlaylistFilter = null;
        window.allTracksData = []; 

        audioEngine.volume = 0.8;
        audioEngine.onended = () => { playRandomTrack(); };

        function playRandomTrack() {
            let pool = [];
            if (window.activePlaylistFilter && window.userPlaylists[window.activePlaylistFilter]) {
                const allowedIds = window.userPlaylists[window.activePlaylistFilter];
                pool = window.allTracksData.filter(t => allowedIds.includes(t.id));
            } else {
                pool = window.allTracksData;
            }
            if (pool.length > 0) {
                const randomTrack = pool[Math.floor(Math.random() * pool.length)];
                streamTrackData(randomTrack);
            }
        }

        function renderHomeGrid() {
            const grid = document.getElementById('dynamicGrid');
            grid.innerHTML = "";
            let tracksToRender = window.allTracksData;
            
            if (window.activePlaylistFilter && window.userPlaylists[window.activePlaylistFilter]) {
                const allowedIds = window.userPlaylists[window.activePlaylistFilter];
                tracksToRender = window.allTracksData.filter(t => allowedIds.includes(t.id));
            }

            if(tracksToRender.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-gray); padding:10px;'>Nessun brano disponibile in questa sezione.</p>";
            }

            tracksToRender.forEach(track => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.onclick = () => streamTrackData(track);
                card.innerHTML = `
                    <img src="${track.cover}" alt="Cover">
                    <h3>${track.title}</h3>
                    <p>${track.artist}</p>
                `;
                grid.appendChild(card);
            });
        }

        function createNewPlaylist() {
            const name = prompt("Inserisci il nome della tua Playlist:");
            if (!name || name.trim() === "") return;
            
            const playlistId = "pl_" + Date.now();
            window.userPlaylists[playlistId] = []; 
            filterViewByPlaylist(playlistId, name.trim());
        }

        function renderPlaylistsSidebar() {
            const container = document.getElementById('playlistsContainer');
            container.innerHTML = "";

            Object.keys(window.userPlaylists).forEach(id => {
                if(id.startsWith('_')) return; 
                const cleanName = window.userPlaylists[id]._customName || "Playlist";
                
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if(window.activePlaylistFilter === id) {
                    item.style.backgroundColor = "var(--bg-hover)";
                    item.style.borderLeft = "4px solid var(--red-primary)";
                }
                
                item.innerHTML = `
                    <span style="flex:1; overflow:hidden; text-overflow:ellipsis;" onclick="filterViewByPlaylist('${id}', '${cleanName.replace(/'/g, "\\'")}')">🎵 ${cleanName}</span>
                    <span onclick="deletePlaylist(event, '${id}')" style="color:var(--text-gray); padding: 0 4px;">❌</span>
                `;
                container.appendChild(item);
            });
        }

        function filterViewByPlaylist(playlistId, playlistName) {
            window.activePlaylistFilter = playlistId;
            if(!window.userPlaylists[playlistId]._customName) {
                window.userPlaylists[playlistId]._customName = playlistName;
            }
            
            renderPlaylistsSidebar();
            if(window.syncPlaylistsToCloud) window.syncPlaylistsToCloud();

            document.getElementById('sideHomeBtn').classList.remove('active');
            document.getElementById('sideSearchBtn').classList.remove('active');
            document.getElementById('pageMainTitle').innerText = "Playlist: " + window.userPlaylists[playlistId]._customName;
            document.getElementById('addSongsToPlaylistBtn').style.display = "flex"; 

            renderHomeGrid();
        }

        function deletePlaylist(event, playlistId) {
            event.stopPropagation();
            if(confirm("Eliminare questa playlist? I brani rimarranno salvati sul lettore.")) {
                delete window.userPlaylists[playlistId];
                if(window.syncPlaylistsToCloud) window.syncPlaylistsToCloud();
                if(window.activePlaylistFilter === playlistId) {
                    showHome();
                } else {
                    renderPlaylistsSidebar();
                }
            }
        }

        function openSongsSelector() {
            if (!window.activePlaylistFilter) return;
            const modal = document.getElementById('songsSelectorModal');
            const container = document.getElementById('selectorTracksContainer');
            container.innerHTML = "";
            const currentPlaylistTrackIds = window.userPlaylists[window.activePlaylistFilter];

            window.allTracksData.forEach(track => {
                const isAdded = currentPlaylistTrackIds.includes(track.id);
                const item = document.createElement('div');
                item.className = 'selector-item';
                item.innerHTML = `
                    <div class="selector-info">
                        <img src="${track.cover}" alt="Cover">
                        <div>
                            <h4>${track.title}</h4>
                            <p>${track.artist}</p>
                        </div>
                    </div>
                    <button class="btn-add-action-trigger ${isAdded ? 'added' : ''}" onclick="toggleTrackInCurrentPlaylist('${track.id}', this)">
                        ${isAdded ? 'Inclusa ✓' : 'Aggiungi +'}
                    </button>
                `;
                container.appendChild(item);
            });
            modal.classList.add('active');
        }

        function toggleTrackInCurrentPlaylist(trackId, buttonElement) {
            if (!window.activePlaylistFilter) return;
            const trackIds = window.userPlaylists[window.activePlaylistFilter];
            const index = trackIds.indexOf(trackId);

            if (index > -1) {
                trackIds.splice(index, 1);
                buttonElement.classList.remove('added');
                buttonElement.innerText = "Aggiungi +";
            } else {
                trackIds.push(trackId);
                buttonElement.classList.add('added');
                buttonElement.innerText = "Inclusa ✓";
            }
            if(window.syncPlaylistsToCloud) window.syncPlaylistsToCloud();
        }

        function closeSongsSelector() {
            document.getElementById('songsSelectorModal').classList.remove('active');
            renderHomeGrid(); 
        }

        function showHome() {
            window.activePlaylistFilter = null;
            document.getElementById('addSongsToPlaylistBtn').style.display = "none";
            document.getElementById('songsSelectorModal').classList.remove('active');
            exitDashboard();
            renderPlaylistsSidebar();
            
            document.getElementById('sideSearchBtn').classList.remove('active');
            document.getElementById('sideHomeBtn').classList.add('active');
            document.getElementById('searchWrapper').style.display = 'none';
            document.getElementById('searchInput').value = '';
            document.getElementById('pageMainTitle').innerText = 'Brani Consigliati';
            renderHomeGrid();
        }

        function activateSearchMode() {
            window.activePlaylistFilter = null;
            document.getElementById('addSongsToPlaylistBtn').style.display = "none";
            renderPlaylistsSidebar();
            document.getElementById('sideHomeBtn').classList.remove('active');
            document.getElementById('sideSearchBtn').classList.add('active');
            document.getElementById('searchWrapper').style.display = 'block';
            document.getElementById('pageMainTitle').innerText = 'Cerca tra i tuoi brani';
            document.getElementById('searchInput').focus();
            renderHomeGrid();
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.music-card');
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                const artist = card.querySelector('p').innerText.toLowerCase();
                if (title.includes(query) || artist.includes(query)) {
                    card.classList.remove('hidden-search');
                } else {
                    card.classList.add('hidden-search');
                }
            });
        }

        function streamTrackData(track) {
            document.getElementById('currentTitle').innerText = track.title;
            document.getElementById('currentArtist').innerText = track.artist;
            document.getElementById('currentCover').src = track.cover;
            audioEngine.src = track.audio;
            audioEngine.load();
            audioEngine.play().then(() => {
                masterPlayBtn.innerText = "⏸";
            }).catch(() => { console.log("Errore stream audio."); });
        }

        function togglePlayback() {
            if(!audioEngine.src) return alert("Scegli un brano dalla Home!");
            if(audioEngine.paused) { audioEngine.play(); masterPlayBtn.innerText = "⏸"; } 
            else { audioEngine.pause(); masterPlayBtn.innerText = "▶"; }
        }

        audioEngine.ontimeupdate = () => {
            if(!isNaN(audioEngine.duration)) {
                timeline.max = Math.floor(audioEngine.duration);
                timeline.value = Math.floor(audioEngine.currentTime);
                timeCurrent.innerText = convertSecondsToMinutes(audioEngine.currentTime);
                timeDuration.innerText = convertSecondsToMinutes(audioEngine.duration);
            }
        };

        function changeTimelinePosition() { audioEngine.currentTime = timeline.value; }
        function adjustVolume() { audioEngine.volume = volumeControl.value; }
        function convertSecondsToMinutes(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" + secs : secs);
        }

        function exitDashboard() { document.getElementById('adminDashboard').classList.remove('active'); resetFormState(); }

        function syncAdminTracksList() {
            const listContainer = document.getElementById('adminTracksList');
            listContainer.innerHTML = ""; 
            if(window.allTracksData.length === 0) {
                listContainer.innerHTML = "<p style='color:var(--text-gray); font-size:14px;'>Nessun brano nel cloud.</p>";
                return;
            }
            window.allTracksData.forEach(track => {
                const item = document.createElement('div');
                item.className = 'manage-track-item';
                item.innerHTML = `
                    <div class="manage-track-info">
                        <img src="${track.cover}" alt="Cover">
                        <div class="manage-track-meta">
                            <h4>${track.title}</h4>
                            <p>${track.artist}</p>
                        </div>
                    </div>
                    <div class="manage-actions">
                        <button type="button" class="btn-manage btn-edit-action" onclick="prepareEditTrack('${track.id}', '${track.title.replace(/'/g, "\\'")}', '${track.artist.replace(/'/g, "\\'")}', '${track.cover.replace(/'/g, "\\'")}', '${track.audio.replace(/'/g, "\\'")}')">Modifica</button>
                        <button type="button" class="btn-manage btn-delete-action" onclick="window.deleteTrack('${track.id}')">Elimina</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function prepareEditTrack(id, title, artist, cover, audio) {
            document.getElementById('editingTrackId').value = id;
            document.getElementById('formTitle').value = title;
            document.getElementById('formArtist').value = artist;
            document.getElementById('formCover').value = cover;
            document.getElementById('formAudio').value = audio;
            document.getElementById('dashFormTitle').innerText = "Modifica Brano Corrente";
            document.getElementById('formSubmitBtn').innerText = "Salva Modifiche";
            document.getElementById('cancelEditBtn').style.display = "block";
        }

        function resetFormState() {
            document.getElementById('editingTrackId').value = "";
            document.getElementById('formTitle').value = "";
            document.getElementById('formArtist').value = "";
            document.getElementById('formCover').value = "";
            document.getElementById('formAudio').value = "";
            document.getElementById('dashFormTitle').innerText = "Inserisci Nuovo Brano";
            document.getElementById('formSubmitBtn').innerText = "Carica Brano in Home";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        window.renderHomeGrid = renderHomeGrid;
        window.renderPlaylistsSidebar = renderPlaylistsSidebar;
        window.prepareEditTrack = prepareEditTrack;
    </script>
</body>
</html>

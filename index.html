<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Beat - Premium Player</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-main: #121212;
            --bg-card: #181818;
            --bg-hover: #282828;
            --red-primary: #e50914;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LAYOUT GENERALE --- */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 90px);
            position: relative;
        }

        /* Sidebar Desktop */
        .sidebar {
            width: 240px;
            background-color: var(--bg-dark);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 90;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
        }
        .logo span { color: var(--red-primary); }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 0;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-link:hover, .nav-link.active { color: var(--text-white); }

        .playlist-sidebar-section {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .btn-create-playlist {
            background-color: #121212;
            color: white;
            border: 1px dashed #333;
            padding: 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .btn-create-playlist:hover { border-color: var(--red-primary); background-color: #181818; }

        .playlists-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 10px 12px;
            background-color: #121212;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist-item:hover { background-color: var(--bg-hover); }

        /* Area Contenuto Principale */
        .main-content {
            flex: 1;
            background: linear-gradient(to bottom, #220304 0%, var(--bg-main) 40%);
            padding: 30px;
            overflow-y: auto;
            position: relative;
            padding-bottom: 120px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .search-container {
            display: none;
            width: 100%;
            max-width: 360px;
        }
        .search-container input {
            width: 100%;
            padding: 12px 20px;
            background-color: #242424;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 14px;
        }
        .search-container input:focus { outline: none; background-color: #2a2a2a; }

        .btn-user-account {
            background-color: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            margin-left: auto;
        }

        .header-playlist-view {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 15px;
        }

        .section-title { font-size: 28px; font-weight: 800; }
        .header-actions-zone { display: flex; align-items: center; gap: 12px; }

        .btn-playlist-shuffle {
            background-color: var(--red-primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add-songs-to-pl {
            background-color: #282828;
            color: white;
            border: 1px solid #444;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Griglia Brani */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        .music-card {
            background-color: #181818;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .music-card:hover { background-color: #282828; }
        .music-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 14px; }
        .music-card h3 { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-card p { font-size: 13px; color: var(--text-gray); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-card.hidden-search { display: none !important; }

        /* --- POPUP SELEZIONE BRANI (+) --- */
        .songs-selector-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212;
            z-index: 95; padding: 30px; overflow-y: auto; display: none;
        }
        .songs-selector-overlay.active { display: block; }
        .selector-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; max-width: 600px; }
        .selector-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background-color: var(--bg-card); border-radius: 6px;
        }
        .selector-info { display: flex; align-items: center; gap: 12px; }
        .selector-info img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
        .btn-add-action-trigger {
            background-color: transparent; color: white; border: 1px solid #727272;
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .btn-add-action-trigger.added { background-color: var(--text-white); color: #000; border-color: var(--text-white); }

        /* --- PLAYER BAR DESKTOP --- */
        .player-bar {
            height: 90px; background-color: #181818; border-top: 1px solid #282828;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; position: fixed; bottom: 0; width: 100%; z-index: 100;
        }
        .track-spec { display: flex; align-items: center; gap: 14px; width: 30%; }
        .track-spec img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; }
        
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
        .playback-buttons { display: flex; align-items: center; gap: 20px; }
        .btn-round-play {
            background-color: var(--text-white); color: black; border: none;
            width: 38px; height: 38px; border-radius: 50%; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .sub-btn { background: none; border: none; color: var(--text-gray); cursor: pointer; font-size: 16px; }
        .sub-btn:hover { color: var(--text-white); }
        .timeline-block { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: var(--text-gray); }
        .timeline-block input { flex: 1; }
        
        .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 16px; width: 30%; }

        /* --- DASHBOARD AMMINISTRATORE CRUCIAL FIX --- */
        .management-dashboard {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-main); z-index: 150; padding: 40px;
            overflow-y: auto; display: none;
        }
        .management-dashboard.active { display: block; }
        .dash-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; margin-top: 30px; }
        .input-form { background-color: var(--bg-card); padding: 30px; border-radius: 8px; display: flex; flex-direction: column; gap: 16px; height: fit-content; }
        .form-row { display: flex; flex-direction: column; gap: 6px; }
        .form-row input { background-color: var(--bg-hover); border: 1px solid #404040; padding: 12px; color: white; border-radius: 4px; }
        
        .manage-tracks-container { background-color: var(--bg-card); padding: 20px; border-radius: 8px; max-height: 70vh; overflow-y: auto; }
        .dash-track-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-bottom: 1px solid #282828; gap: 10px;
        }
        .dash-track-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
        .dash-actions { display: flex; gap: 8px; }
        .btn-dash-edit { background-color: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-dash-del { background-color: var(--red-primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* Modale Auth Generico */
        .auth-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); z-index: 200; display: none;
            align-items: center; justify-content: center; padding: 16px;
        }
        .auth-modal-box {
            background-color: #121212; border-radius: 8px; padding: 32px;
            width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; position: relative;
        }
        .auth-modal-box input { width: 100%; padding: 14px; background-color: #2A2A2A; border: none; color: white; border-radius: 4px; }
        .btn-auth { width: 100%; background-color: var(--red-primary); color: white; border: none; padding: 14px; font-weight: 700; border-radius: 25px; cursor: pointer; }
        .close-popup-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* --- RESPONSIVE MOBILE (REPLICA SPOTIFY) --- */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: calc(100vh - 135px); }
            .sidebar, .player-right, .timeline-block, .player-bar .sub-btn { display: none !important; }

            .main-content {
                padding: 70px 14px 140px 14px;
                background: linear-gradient(to bottom, #2a0406 0%, #121212 35%);
            }

            .top-bar { position: absolute; top: 15px; left: 14px; right: 14px; margin-bottom: 0; z-index: 80; }
            .section-title { font-size: 22px; font-weight: 800; }

            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .music-card { padding: 10px; background-color: #141414; }
            .music-card img { margin-bottom: 8px; }
            .music-card h3 { font-size: 13px; }
            .music-card p { font-size: 11px; }

            /* Spotify Bottom Nav */
            .mobile-bottom-nav {
                display: flex !important; position: fixed; bottom: 0; left: 0; width: 100%;
                height: 65px; background-color: #000000; border-top: 1px solid #121212;
                justify-content: space-around; align-items: center; z-index: 110; padding-bottom: 5px;
            }
            .mobile-nav-item {
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                color: var(--text-gray); font-size: 10px; font-weight: 600; cursor: pointer; gap: 4px; flex: 1;
            }
            .mobile-nav-item.active { color: var(--text-white); }
            .mobile-nav-item span:first-child { font-size: 20px; }

            /* Spotify Floating Mini-Player */
            .player-bar {
                height: 60px; background-color: #222326; border-radius: 8px;
                position: fixed; bottom: 72px; left: 8px; right: 8px;
                width: calc(100% - 16px); padding: 0 12px; display: flex;
                justify-content: space-between; align-items: center; border: none; z-index: 105;
            }
            .track-spec { width: 75%; gap: 10px; }
            .track-spec img { width: 40px; height: 40px; }
            .track-spec-text h4 { font-size: 13px; }
            .track-spec-text p { font-size: 11px; }
            .player-center { width: 20%; align-items: flex-end; }
            .playback-buttons { gap: 0; }
            .btn-round-play { background-color: transparent; color: white; width: 34px; height: 34px; font-size: 22px; }
            
            /* Dashboard Mobile Adaptive */
            .dash-layout { grid-template-columns: 1fr; gap: 20px; }
        }

        .mobile-bottom-nav { display: none; }
    </style>
</head>
<body>

    <audio id="audioEngine"></audio>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="logo" onclick="showHome()">Red<span>Beat</span></div>
            <div class="nav-link active" id="sideHomeBtn" onclick="showHome()">🏠 Home</div>
            <div class="nav-link" id="sideSearchBtn" onclick="activateSearchMode()">🔍 Cerca</div>
            
            <div class="playlist-sidebar-section">
                <button class="btn-create-playlist" onclick="createNewPlaylist()">➕ Crea Playlist</button>
                <div class="playlists-list" id="playlistsContainer"></div>
            </div>
        </aside>

        <main class="main-content" id="mainHomeView">
            <div class="top-bar">
                <div class="search-container" id="searchWrapper">
                    <input type="text" id="searchInput" placeholder="Cosa vuoi ascoltare?" oninput="executeSearch()">
                </div>
                <button class="btn-user-account" id="accountMenuBtn" onclick="window.handleAccountButtonClick()">
                    <span id="accountBtnIcon">👤</span> <span id="accountBtnText">Accedi</span>
                </button>
            </div>

            <div class="header-playlist-view">
                <div class="section-title" id="pageMainTitle">Brani Consigliati</div>
                <div class="header-actions-zone">
                    <button class="btn-playlist-shuffle" id="playlistShuffleBtn" style="display: none;" onclick="shuffleCurrentPlaylist()">
                        <span>🔀</span> Shuffle
                    </button>
                    <button class="btn-add-songs-to-pl" id="addSongsToPlaylistBtn" style="display: none;" onclick="openSongsSelector()">+</button>
                </div>
            </div>
            
            <div class="grid-container" id="dynamicGrid"></div>

            <div class="songs-selector-overlay" id="songsSelectorModal">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="font-size:18px;">Aggiungi brani alla playlist</h2>
                    <button class="sub-btn" style="background:#222; padding:8px 16px; border-radius:20px; color:white; font-size:13px;" onclick="closeSongsSelector()">Fatto ✓</button>
                </div>
                <div class="selector-list" id="selectorTracksContainer"></div>
            </div>
        </main>

        <div class="management-dashboard" id="adminDashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px;">
                <h2 id="dashFormTitle">Gestione Catalogo Musicale</h2>
                <button class="sub-btn" style="background: var(--bg-hover); padding: 10px 20px; border-radius: 20px; color: white;" onclick="exitDashboard()">← Torna al Player</button>
            </div>
            <div class="dash-layout">
                <div class="input-form">
                    <h3 id="formActionLabel" style="font-size: 16px; color: var(--text-gray);">Nuovo Brano</h3>
                    <input type="hidden" id="editingTrackId" value="">
                    <div class="form-row"><label>Titolo</label><input type="text" id="formTitle"></div>
                    <div class="form-row"><label>Artista</label><input type="text" id="formArtist"></div>
                    <div class="form-row"><label>URL Copertina</label><input type="url" id="formCover"></div>
                    <div class="form-row"><label>URL File Audio (.mp3)</label><input type="url" id="formAudio"></div>
                    <button type="button" class="btn-submit-track" id="formSubmitBtn" onclick="window.commitTrackForm()">Carica Brano</button>
                    <button type="button" class="btn-submit-track" id="cancelEditBtn" style="background-color:#444; display:none; margin-top: -8px;" onclick="window.resetFormState()">Annulla</button>
                </div>
                <div class="manage-tracks-container">
                    <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--text-gray);">Brani Presenti nel Database</h3>
                    <div id="adminTracksList"></div>
                </div>
            </div>
        </div>

    </div>

    <footer class="player-bar">
        <div class="track-spec">
            <img id="currentCover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500" alt="Cover">
            <div style="overflow: hidden;">
                <h4 id="currentTitle" style="white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">Nessun brano</h4>
                <p id="currentArtist" style="font-size: 12px; color: var(--text-gray); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">Seleziona una traccia</p>
            </div>
        </div>
        <div class="player-center">
            <div class="playback-buttons">
                <button class="sub-btn">🔀</button>
                <button class="sub-btn" onclick="playRandomTrack()">⏮</button>
                <button class="btn-round-play" id="masterPlayBtn" onclick="togglePlayback()">▶</button>
                <button class="sub-btn" onclick="playRandomTrack()">⏭</button>
                <button class="sub-btn">🔁</button>
            </div>
            <div class="timeline-block">
                <span id="timeCurrent">0:00</span>
                <input type="range" id="timeline" min="0" value="0" oninput="changeTimelinePosition()">
                <span id="timeDuration">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <div style="display: flex; align-items: center; gap: 8px; width: 120px; margin-right: 15px;">
                <span>🔊</span><input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.8" oninput="adjustVolume()">
            </div>
            <button class="sub-btn" style="font-size: 18px;" onclick="window.openAdminDashboard()">⚙️ Dashboard</button>
        </div>
    </footer>

    <nav class="mobile-bottom-nav">
        <div class="mobile-nav-item active" id="mobHome" onclick="showHome(); resetNavActive(this);">
            <span>🏠</span><span>Home</span>
        </div>
        <div class="mobile-nav-item" id="mobSearch" onclick="activateSearchMode(); resetNavActive(this);">
            <span>🔍</span><span>Cerca</span>
        </div>
        <div class="mobile-nav-item" id="mobPlaylist" onclick="window.openMobileLibrary(); resetNavActive(this);">
            <span>🎵</span><span>Libreria</span>
        </div>
    </nav>

    <div class="auth-popup-overlay" id="authPopup">
        <div class="auth-modal-box">
            <button class="close-popup-btn" onclick="toggleAuthPopup(false)">×</button>
            <h3>Accedi a Red Beat</h3>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Password">
            <button class="btn-auth" onclick="window.processUserLogin()">Accedi</button>
            <button class="btn-auth" style="background-color:#333; margin-top:5px;" onclick="window.processUserRegistration()">Registrati</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDai_-FplRtAI0fUXgfClBzrRprZFHL4OU",
            authDomain: "redbeat.firebaseapp.com",
            databaseURL: "https://redbeat-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "redbeat",
            storageBucket: "redbeat.firebasestorage.app",
            messagingSenderId: "951595303453",
            appId: "1:951595303453:web:23e2f3829dd51ba1707cf4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const rtdb = getDatabase(app);
        const ADMIN_EMAIL = "simone10erre@gmail.com";
        let playlistListenerRef = null;

        onAuthStateChanged(auth, (user) => {
            if(playlistListenerRef) { playlistListenerRef(); playlistListenerRef = null; }
            if (user) {
                document.getElementById('accountBtnText').innerText = user.email === ADMIN_EMAIL ? "Admin (Esci)" : "Profilo (Esci)";
                playlistListenerRef = onValue(ref(rtdb, 'utenti_playlists/' + user.uid), (snapshot) => {
                    const data = snapshot.val() || {};
                    window.userPlaylists = data;
                    window.renderPlaylistsSidebar();
                    window.renderHomeGrid();
                });
            } else {
                document.getElementById('accountBtnText').innerText = "Accedi";
                window.userPlaylists = {}; window.activePlaylistFilter = null;
                window.renderPlaylistsSidebar(); window.renderHomeGrid();
            }
        });

        // Autenticazione standard
        window.processUserRegistration = async () => {
            try { await createUserWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value); toggleAuthPopup(false); } catch(e) { alert(e.message); }
        };
        window.processUserLogin = async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value); toggleAuthPopup(false); } catch(e) { alert("Dati non validi o utente inesistente."); }
        };
        window.handleAccountButtonClick = () => {
            if(auth.currentUser) { if(confirm("Vuoi disconnetterti?")) signOut(auth); } else toggleAuthPopup(true);
        };

        // Gestione Playlist Cloud (Fissato l'invio pulito dei campi e array)
        window.updatePlaylistOnCloud = async () => {
            if(auth.currentUser) {
                await set(ref(rtdb, 'utenti_playlists/' + auth.currentUser.uid), window.userPlaylists);
            }
        };

        // Realtime sync del catalogo brani globale
        onValue(ref(rtdb, 'brani'), (snapshot) => {
            window.allTracksData = []; 
            const data = snapshot.val();
            if(data) {
                Object.keys(data).forEach(k => {
                    window.allTracksData.push({ id: k, ...data[k] });
                });
            }
            window.renderHomeGrid();
            window.syncAdminDashboardTracks();
        });

        // Operazioni CRUD della Dashboard Amministratore
        window.openAdminDashboard = () => {
            if(auth.currentUser && auth.currentUser.email === ADMIN_EMAIL) {
                document.getElementById('adminDashboard').classList.add('active');
                window.syncAdminDashboardTracks();
            } else {
                alert("Accesso negato. Solo l'amministratore autenticato può accedere.");
            }
        };

        window.commitTrackForm = async () => {
            const title = document.getElementById('formTitle').value.trim();
            const artist = document.getElementById('formArtist').value.trim();
            const cover = document.getElementById('formCover').value.trim();
            const audio = document.getElementById('formAudio').value.trim();
            const id = document.getElementById('editingTrackId').value;

            if(!title || !artist || !cover || !audio) return alert("Compila tutti i campi!");

            const payload = { title, artist, cover, audio, timestamp: Date.now() };

            if(id) {
                await set(ref(rtdb, 'brani/' + id), payload);
            } else {
                await set(ref(rtdb, 'brani/' + push(ref(rtdb, 'brani')).key), payload);
            }
            window.resetFormState();
        };

        window.deleteTrackFromDb = async (id) => {
            if(confirm("Sei sicuro di voler eliminare definitivamente questo brano dal database?")) {
                await remove(ref(rtdb, 'brani/' + id));
            }
        };

        window.getFirebaseUser = () => auth.currentUser;
    </script>

    <script>
        const audioEngine = document.getElementById('audioEngine');
        const masterPlayBtn = document.getElementById('masterPlayBtn');
        const timeline = document.getElementById('timeline');
        
        window.userPlaylists = {}; 
        window.activePlaylistFilter = null; 
        window.allTracksData = [];

        audioEngine.volume = 0.8;
        audioEngine.onended = () => playRandomTrack();

        function toggleAuthPopup(show) { document.getElementById('authPopup').style.display = show ? 'flex' : 'none'; }

        function renderHomeGrid() {
            const grid = document.getElementById('dynamicGrid'); 
            grid.innerHTML = "";
            let list = window.allTracksData;

            if (window.activePlaylistFilter && window.userPlaylists[window.activePlaylistFilter]) {
                const playlistObj = window.userPlaylists[window.activePlaylistFilter];
                const ids = playlistObj.tracks || [];
                list = window.allTracksData.filter(t => ids.includes(t.id));
            }

            if(list.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-gray); padding:10px;'>Nessun brano da mostrare.</p>";
                return;
            }

            list.forEach(t => {
                const card = document.createElement('div'); 
                card.className = 'music-card'; 
                card.onclick = () => streamTrackData(t);
                card.innerHTML = `<img src="${t.cover}"><h3>${t.title}</h3><p>${t.artist}</p>`;
                grid.appendChild(card);
            });
        }

        function filterViewByPlaylist(id, name) {
            window.activePlaylistFilter = id;
            document.getElementById('pageMainTitle').innerText = name;
            document.getElementById('addSongsToPlaylistBtn').style.display = "flex";
            document.getElementById('playlistShuffleBtn').style.display = "flex";
            renderHomeGrid();
        }

        function shuffleCurrentPlaylist() {
            if(!window.activePlaylistFilter || !window.userPlaylists[window.activePlaylistFilter]) return;
            const ids = window.userPlaylists[window.activePlaylistFilter].tracks || [];
            const pool = window.allTracksData.filter(t => ids.includes(t.id));
            if(pool.length === 0) return alert("Questa playlist è vuota! Clicca sul tasto '+' per aggiungere brani.");
            streamTrackData(pool[Math.floor(Math.random() * pool.length)]);
        }

        // TASTO + : SELETTORE TOTALMENTE FIXATO
        function openSongsSelector() {
            if(!window.activePlaylistFilter) return alert("Nessuna playlist selezionata!");
            const modal = document.getElementById('songsSelectorModal');
            const container = document.getElementById('selectorTracksContainer'); 
            container.innerHTML = "";

            const playlistObj = window.userPlaylists[window.activePlaylistFilter];
            const activeIds = (playlistObj && playlistObj.tracks) ? playlistObj.tracks : [];

            window.allTracksData.forEach(t => {
                const has = activeIds.includes(t.id);
                const item = document.createElement('div'); 
                item.className = 'selector-item';
                item.innerHTML = `
                    <div class="selector-info">
                        <img src="${t.cover}">
                        <div><h4 style="font-size:14px;">${t.title}</h4><p style="font-size:12px; color:var(--text-gray);">${t.artist}</p></div>
                    </div>
                    <button class="btn-add-action-trigger ${has ? 'added' : ''}" onclick="toggleTrackInPlaylist('${t.id}', this)">
                        ${has ? 'Incluso ✓' : 'Aggiungi +'}
                    </button>
                `;
                container.appendChild(item);
            });
            modal.classList.add('active');
        }

        function toggleTrackInPlaylist(trackId, btn) {
            if (!window.activePlaylistFilter) return;
            
            if (!window.userPlaylists[window.activePlaylistFilter].tracks) {
                window.userPlaylists[window.activePlaylistFilter].tracks = [];
            }

            const list = window.userPlaylists[window.activePlaylistFilter].tracks;
            const idx = list.indexOf(trackId);

            if(idx > -1) {
                list.splice(idx, 1);
                btn.classList.remove('added');
                btn.innerText = "Aggiungi +";
            } else {
                list.push(trackId);
                btn.classList.add('added');
                btn.innerText = "Incluso ✓";
            }
            window.updatePlaylistOnCloud();
        }

        function createNewPlaylist() {
            if(!window.getFirebaseUser()) return alert("Devi effettuare l'accesso per creare playlist personalizzate.");
            const n = prompt("Inserisci il nome della tua nuova Playlist:");
            if(!n || n.trim() === "") return;
            const id = "pl_" + Date.now();
            
            window.userPlaylists[id] = {
                _customName: n.trim(),
                tracks: []
            };
            window.updatePlaylistOnCloud();
            filterViewByPlaylist(id, n.trim());
        }

        function renderPlaylistsSidebar() {
            const c = document.getElementById('playlistsContainer'); 
            if(!c) return; 
            c.innerHTML = "";
            Object.keys(window.userPlaylists).forEach(id => {
                const name = window.userPlaylists[id]._customName || "Mio Elenco";
                const item = document.createElement('div'); 
                item.className = 'playlist-item';
                item.innerHTML = `<span onclick="filterViewByPlaylist('${id}', '${name}')">🎵 ${name}</span>`;
                c.appendChild(item);
            });
        }

        // AGGIORNAMENTO DELLA LISTA DELLA DASHBOARD (READ, UPDATE, DELETE)
        function syncAdminDashboardTracks() {
            const listContainer = document.getElementById('adminTracksList');
            if(!listContainer) return;
            listContainer.innerHTML = "";

            if(window.allTracksData.length === 0) {
                listContainer.innerHTML = "<p style='color:var(--text-gray);'>Nessun brano nel database.</p>";
                return;
            }

            window.allTracksData.forEach(t => {
                const div = document.createElement('div');
                div.className = 'dash-track-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px; overflow:hidden;">
                        <img src="${t.cover}">
                        <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                            <strong style="font-size:13px; display:block;">${t.title}</strong>
                            <span style="font-size:11px; color:var(--text-gray);">${t.artist}</span>
                        </div>
                    </div>
                    <div class="dash-actions">
                        <button class="btn-dash-edit" onclick="prepareTrackEdit('${t.id}')">Modifica</button>
                        <button class="btn-dash-del" onclick="window.deleteTrackFromDb('${t.id}')">Elimina</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function prepareTrackEdit(id) {
            const track = window.allTracksData.find(t => t.id === id);
            if(!track) return;

            document.getElementById('editingTrackId').value = track.id;
            document.getElementById('formTitle').value = track.title;
            document.getElementById('formArtist').value = track.artist;
            document.getElementById('formCover').value = track.cover;
            document.getElementById('formAudio').value = track.audio;

            document.getElementById('formActionLabel').innerText = "Modifica Brano Esistente";
            document.getElementById('formSubmitBtn').innerText = "Aggiorna Brano";
            document.getElementById('cancelEditBtn').style.display = "block";
        }

        window.resetFormState = function() {
            document.getElementById('editingTrackId').value = "";
            document.getElementById('formTitle').value = "";
            document.getElementById('formArtist').value = "";
            document.getElementById('formCover').value = "";
            document.getElementById('formAudio').value = "";

            document.getElementById('formActionLabel').innerText = "Nuovo Brano";
            document.getElementById('formSubmitBtn').innerText = "Carica Brano";
            document.getElementById('cancelEditBtn').style.display = "none";
        };

        function showHome() {
            window.activePlaylistFilter = null;
            document.getElementById('addSongsToPlaylistBtn').style.display = "none";
            document.getElementById('playlistShuffleBtn').style.display = "none";
            document.getElementById('searchWrapper').style.display = 'none';
            document.getElementById('pageMainTitle').innerText = 'Brani Consigliati';
            renderHomeGrid();
        }

        function activateSearchMode() {
            document.getElementById('searchWrapper').style.display = 'block';
            document.getElementById('pageMainTitle').innerText = 'Cerca';
            document.getElementById('searchInput').focus();
        }

        function executeSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.music-card').forEach(c => {
                const text = c.querySelector('h3').innerText.toLowerCase() + c.querySelector('p').innerText.toLowerCase();
                if(text.includes(q)) c.classList.remove('hidden-search'); else c.classList.add('hidden-search');
            });
        }

        function openMobileLibrary() {
            const keys = Object.keys(window.userPlaylists);
            if(keys.length > 0) {
                filterViewByPlaylist(keys[0], window.userPlaylists[keys[0]]._customName);
            } else {
                createNewPlaylist();
            }
        }

        function resetNavActive(element) {
            document.querySelectorAll('.mobile-nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }

        function streamTrackData(t) {
            document.getElementById('currentTitle').innerText = t.title;
            document.getElementById('currentArtist').innerText = t.artist;
            document.getElementById('currentCover').src = t.cover;
            audioEngine.src = t.audio; 
            audioEngine.load();
            audioEngine.play().then(() => masterPlayBtn.innerText = "⏸");
        }

        function togglePlayback() {
            if(!audioEngine.src) return;
            if(audioEngine.paused) { audioEngine.play(); masterPlayBtn.innerText = "⏸"; }
            else { audioEngine.pause(); masterPlayBtn.innerText = "▶"; }
        }

        function playRandomTrack() {
            if(window.allTracksData.length > 0) {
                streamTrackData(window.allTracksData[Math.floor(Math.random() * window.allTracksData.length)]);
            }
        }

        audioEngine.ontimeupdate = () => {
            if(!isNaN(audioEngine.duration)) {
                timeline.max = Math.floor(audioEngine.duration); 
                timeline.value = Math.floor(audioEngine.currentTime);
                document.getElementById('timeCurrent').innerText = convertSecondsToMinutes(audioEngine.currentTime);
                document.getElementById('timeDuration').innerText = convertSecondsToMinutes(audioEngine.duration);
            }
        };

        function changeTimelinePosition() { audioEngine.currentTime = timeline.value; }
        function adjustVolume() { audioEngine.volume = document.getElementById('volumeControl').value; }
        
        function convertSecondsToMinutes(s) {
            let m = Math.floor(s / 60); 
            let sec = Math.floor(s % 60); 
            return m + ":" + (sec < 10 ? "0" + sec : sec);
        }
        
        function closeSongsSelector() { document.getElementById('songsSelectorModal').classList.remove('active'); renderHomeGrid(); }
        function exitDashboard() { document.getElementById('adminDashboard').classList.remove('active'); }
    </script>
</body>
</html>
